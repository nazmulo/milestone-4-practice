<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bubble</title>
    <style>
        body{
            border: 2px solid red;
            margin: 2px;
        }
        section{
            border: 2px solid green;
            margin: 2px;
        }
        ol{
            border: 2px solid purple;
            margin: 2px;
        }
        li{
            border: 2px solid blue;
            margin: 2px;
        }
    </style>
</head>
<body>
    <h1>explore event bubble</h1>
    <section id="list-container">
        <h3>list of things</h3>
        <ol id="item-list">
            <li id="item-1">Lorem, ipsum dolor.</li>
            <li id="item-2">Lorem, ipsum dolor.</li>
            <li id="item-3">Lorem, ipsum dolor.</li>
            <li id="item-4">Lorem, ipsum dolor.</li>
            <li id="item-5">Lorem, ipsum dolor.</li>
            <li id="item-6">Lorem, ipsum dolor.</li>
            
        </ol>
    </section>

    <script>

        // list item 2 click handler
        
        document.getElementById('item-2')
        .addEventListener('click', function () {
            console.log('item 2 click')
        })


        // ol click handler

        document.getElementById('item-list')
        .addEventListener('click', function () {
            console.log('ol clicked')
        })

        
    </script>
</body>
</html>
