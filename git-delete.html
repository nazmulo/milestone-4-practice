<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>git delete</title>
</head>
<body>

    <h1 id="secrect-info">my secret info</h1>
    <input id="input-delete" type="text" placeholder="write delete">
    <button id="btn-delete" disabled >delete</button>

<script>
    document.getElementById('input-delete')
    .addEventListener('keyup', function(event){
        const text = event.target.value;
        const btnDelete = document.getElementById('btn-delete');
        //console.log('user is typing',text);
        if(text === 'delete'){
            //console.log('delete type')
            btnDelete.removeAttribute('disabled');
            const secrectTag = document.getElementById('secrect-info');
            secrectTag.style.display = 'none'
        }
        else{
            //console.log('something else')
            btnDelete.setAttribute('disabled', true);

        }
    })
</script>

</body>
</html>
